# Publishes a release: push a tag like 2.0.0 (no v prefix) that matches the
# version in src/package.json and every addons/*/package.json. Package
# Manager installs the SDK and its add-ons from that tag through the README's
# git URL, and the Mod Hub's update banner offers it. The version's section of
# CHANGELOG.md is the release's description; the release stops if it has none.
#
# A manual run checks but never publishes: the job below only publishes from
# a tag.

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# Read-only by default; only the job that publishes can write.
permissions:
  contents: read

jobs:
  # Nothing ships unless CI passes.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit

  release:
    needs: ci
    # Only from a tag: a manual run from a branch checks but never publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          foreach ($manifest in @('src/package.json') + (Get-ChildItem addons/*/package.json | ForEach-Object { $_.FullName })) {
            $package = Get-Content $manifest -Raw | ConvertFrom-Json
            if ($package.version -ne $env:GITHUB_REF_NAME) {
              throw "tag $env:GITHUB_REF_NAME does not match the version in $manifest, $($package.version)"
            }
            $sdk = $package.dependencies.'com.deadman.modcomponent.sdk'
            if ($sdk -and $sdk -ne $env:GITHUB_REF_NAME) {
              throw "$manifest needs SDK $sdk, not $env:GITHUB_REF_NAME"
            }
          }

      - name: Read the release notes from CHANGELOG.md
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:GITHUB_REF_NAME -OutDir notes

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The changelog section first, then GitHub's generated notes (merged PRs and the full changelog link).
        run: gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes-file notes/release-notes.md --generate-notes --verify-tag

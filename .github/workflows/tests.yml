name: Tests

on:
  pull_request:
  push:
    branches: [main, develop, rewrite]
  workflow_dispatch:

jobs:
  editmode:
    name: EditMode tests (Unity 6000.0.60f1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('package.json') }}
          restore-keys: Library-

      # Needs repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD (see game.ci "Activation").
      # Tests that run a full Addressables build skip themselves here: they need the ENABLE_JSON_CATALOG define,
      # which a fresh package-mode project doesn't have.
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: .
          unityVersion: 6000.0.60f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

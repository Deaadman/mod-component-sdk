# Checks every push to main and every pull request: the changelog's format
# and the EditMode tests, run with the package in package mode. The nightly
# and release workflows run this first and only publish when it passes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Changelog
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Check

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('src/package.json') }}
          restore-keys: Library-

      # Needs repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD (see game.ci "Activation").
      # Tests that run a full Addressables build skip themselves here: they need the ENABLE_JSON_CATALOG define,
      # which a fresh package-mode project doesn't have.
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: src
          unityVersion: 6000.0.60f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
